<app-header></app-header>
<div class="home-container">

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Welcome to <span>LoanApp</span></h1>
      <p>Your trusted partner for quick, simple, and secure loans.</p>
      <button mat-raised-button color="primary" class="hero-btn">
        <mat-icon>arrow_forward</mat-icon>
        Apply Now
      </button>
    </div>
  </section>

  <!-- Progressive Steps -->
  <section class="progressive-steps">
    <div class="step" *ngFor="let s of steps">
      <mat-icon class="step-icon" color="primary">{{ s.icon }}</mat-icon>
      <h2>{{ s.title }}</h2>
      <p>{{ s.desc }}</p>
    </div>
  </section>

  <!-- CTA Section -->
  <section class="cta">
    <h2>Ready to get started?</h2>
    <p>Join thousands of happy customers who trust LoanApp for their financial needs.</p>
    <button mat-stroked-button color="accent" class="cta-btn">
      <mat-icon>touch_app</mat-icon>
      Get Started
    </button>
  </section>

</div>
