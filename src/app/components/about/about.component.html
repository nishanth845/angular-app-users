<div class="about-container">

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>About <span>LoanApp</span></h1>
      <p>Simple, fast, and secure loans at your fingertips.</p>
    </div>
  </section>

  <!-- Progressive Steps -->
  <section class="progressive-steps">
    <div class="step" *ngFor="let s of steps">
      <mat-icon class="step-icon" color="primary">{{ s.icon }}</mat-icon>
      <h2>{{ s.title }}</h2>
      <p>{{ s.desc }}</p>
    </div>
  </section>

  <!-- Mission Section -->
  <section class="mission">
    <h2>Our Mission</h2>
    <p>
      We aim to empower individuals with easy access to credit, ensuring
      transparency, security, and financial growth for everyone.
    </p>
  </section>

</div>
